<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middleman — Firmware</title>
<!--
  The entire web UI, deliberately.

  The dashboard, config editor and PAS controls all live in the Android app, which
  talks BLE. This page exists for exactly one job that BLE cannot do: pushing a
  ~1.5 MB firmware image, which has no place in a GATT request. Nothing here is
  cached, nothing is installed, and nothing is fetched off-device.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b1220; color: #e6edf7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(30rem, 92vw); padding: 1.75rem; }
  h1 { font-size: 1.15rem; letter-spacing: .02em; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: #93a4bd; font-size: .85rem; }
  label { display: block; font-size: .8rem; color: #93a4bd; margin-bottom: .4rem; }
  input[type=file] {
    width: 100%; padding: .6rem; border-radius: .5rem; box-sizing: border-box;
    border: 1px solid #24304a; background: #111a2c; color: #e6edf7; font-size: .85rem;
  }
  button {
    margin-top: 1rem; width: 100%; padding: .8rem; border: 0; border-radius: .5rem;
    background: #0ea5a5; color: #04121a; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  button:disabled { background: #24304a; color: #6d7f9c; cursor: default; }
  .bar { height: .5rem; margin-top: 1rem; border-radius: .25rem; background: #111a2c; overflow: hidden; display: none; }
  .bar > div { height: 100%; width: 0; background: #0ea5a5; transition: width .15s linear; }
  .status { margin-top: .6rem; font-size: .8rem; color: #93a4bd; min-height: 1.2em; }
  .warn { margin-top: 1.5rem; font-size: .78rem; color: #f0b429; }
</style>
</head>
<body>
<main>
  <h1>Firmware update</h1>
  <p class="sub">Middleman ESP32-S3 · over Wi-Fi</p>

  <label for="fw">Firmware image (.bin)</label>
  <input type="file" id="fw" accept=".bin,application/octet-stream">

  <button id="go" onclick="upload()">Upload and reboot</button>

  <div class="bar" id="bar"><div id="fill"></div></div>
  <div class="status" id="status"></div>

  <p class="warn">
    Everything else — dashboard, configuration, assist controls — is in the Android
    app over Bluetooth. This page only exists because a firmware image is too large
    to send over BLE.
  </p>
</main>

<script>
function say(msg) { document.getElementById('status').textContent = msg; }

function size(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function upload() {
  const file = document.getElementById('fw').files[0];
  if (!file) { say('Choose a .bin firmware file first.'); return; }
  if (!file.name.toLowerCase().endsWith('.bin')) { say('Only .bin images are accepted.'); return; }

  const btn = document.getElementById('go');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');

  btn.disabled = true;
  btn.textContent = 'Uploading…';
  bar.style.display = 'block';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/update', true);

  xhr.upload.onprogress = function (e) {
    if (!e.lengthComputable) return;
    const pct = Math.round((e.loaded / e.total) * 100);
    fill.style.width = pct + '%';
    say(pct + '%  (' + size(e.loaded) + ' of ' + size(e.total) + ')');
  };

  xhr.onload = function () {
    if (xhr.status === 200) {
      fill.style.width = '100%';
      say('Written. The device is rebooting — reconnect in about ten seconds.');
      btn.textContent = 'Done';
    } else {
      say('Failed: ' + (xhr.responseText || ('HTTP ' + xhr.status)));
      btn.disabled = false;
      btn.textContent = 'Upload and reboot';
    }
  };

  xhr.onerror = function () {
    say('Network error during upload. The device may still be running the old firmware.');
    btn.disabled = false;
    btn.textContent = 'Upload and reboot';
  };

  // Raw body, no multipart wrapper: the firmware streams straight into Update.
  xhr.send(file);
}
</script>
</body>
</html>
