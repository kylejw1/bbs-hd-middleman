; Standalone DPS310 bench test for an ESP32 DevKit V1.
;
; Deliberately NOT part of the middleman build: it has its own setup()/loop(),
; and linking two of those into one image is the failure mode the main
; platformio.ini warns about. Build and flash it from this directory:
;
;   cd tools/dps310_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
; DOIT-style DevKit V1 boards frequently will not boot with dio: the ROM loads
; the second-stage bootloader and then loops on the entry point with no boot
; output at all. dout is the mode these clones expect.
board_build.flash_mode = dout
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
; 460800 failed on this board with "Unable to verify flash chip connection"
; right after the baud change, so keep the stub at a rate the CP210x and the
; 26 MHz crystal clearly manage.
upload_speed = 115200
