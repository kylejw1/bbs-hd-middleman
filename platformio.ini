; PlatformIO Project Configuration File
;
; Only the default environment is built/targeted by a bare `pio run`. Without
; this, `pio run -t upload` would flash EVERY environment in this file --
; including the experimental BLE one, straight over the working firmware.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Decodes ESP32 panic backtraces into function names and line numbers, so a
; crash log names the offending call instead of just hex addresses.
monitor_filters = default, esp32_exception_decoder
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE is deliberately NOT defined here: the
    ; prebuilt ESP32-S3 sdkconfig.h already sets it to 1, so passing it on the
    ; command line only produced a redefinition warning on every framework file.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
; Regenerates include/WebContent.h from web/index.html before every build so the
; on-device dashboard and the GitHub Pages copy can never drift apart.
extra_scripts =
    pre:tools/embed_web.py

; -----------------------------------------------------------------------------
; Experimental BLE transport.
;
; A separate environment on purpose: it gets its own build directory
; (.pio/build/ble), so switching between BLE and no-BLE can never flash a stale
; artifact from the other mode. PlatformIO does not reliably notice that
; PLATFORMIO_BUILD_FLAGS changed, and a stale BLE-enabled image is exactly how
; the bridge got broken on the bike: Bluedroid's init keeps setup() from ever
; reaching loop(), so the display loses its pass-through and throws a comm error.
;
; Build and flash the default (BLE off) firmware:
;     pio run -t upload
; Build and flash the experimental BLE firmware:
;     pio run -e ble -t upload
; -----------------------------------------------------------------------------
[env:ble]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DBLE_TRANSPORT_ENABLED=1

; -----------------------------------------------------------------------------
; ST7789 LCD — 2.25" strip, 76×284, mounted landscape (284×76 effective)
;
; Wiring (HSPI, 3.3 V — direct connection, no level shifting needed):
;   ESP32-S3 GPIO 11 → MOSI (SDA on display board)
;   ESP32-S3 GPIO 12 → SCLK (SCL on display board)
;   ESP32-S3 GPIO 10 → CS
;   ESP32-S3 GPIO  9 → DC  (A0/RS)
;   ESP32-S3 GPIO  8 → RST
;   3V3              → VCC
;   GND              → GND
;   BL pin or 3V3    → BL (always-on; see the -DTFT_BL note in [env:gc9a01-esp32])
;
; Build and flash:
;   pio run -e st7789 -t upload
; -----------------------------------------------------------------------------
[env:st7789]
extends = env:esp32-s3-devkitc-1
lib_deps =
    ${env:esp32-s3-devkitc-1.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DLCD_DISPLAY_ST7789=1
    ; TFT_eSPI pin injection — overrides any User_Setup.h the library ships with
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=76
    -DTFT_HEIGHT=284
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=-1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    ; No touchscreen on either panel: -1 stops TFT_eSPI emitting
    ; ">>>>------>> TOUCH_CS pin not defined" on every compile.
    -DTOUCH_CS=-1

; -----------------------------------------------------------------------------
; GC9A01 LCD — 1.28" round, 240×240
;
; Same HSPI wiring as ST7789 above.
;
; Build and flash:
;   pio run -e gc9a01 -t upload
; -----------------------------------------------------------------------------
[env:gc9a01]
extends = env:esp32-s3-devkitc-1
lib_deps =
    ${env:esp32-s3-devkitc-1.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DLCD_DISPLAY_GC9A01=1
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=-1
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    ; No touchscreen on either panel: -1 stops TFT_eSPI emitting
    ; ">>>>------>> TOUCH_CS pin not defined" on every compile.
    -DTOUCH_CS=-1

; -----------------------------------------------------------------------------
; GC9A01 round display on a classic ESP32 ("ESP-32S" / ESP32-WROOM-32, 30-pin).
;
; This is NOT an ESP32-S3, which changes four things versus the default env:
;
;  1. Different chip target. `board = esp32dev`, and the S3-only USB flags
;     (ARDUINO_USB_CDC_ON_BOOT / ARDUINO_USB_MODE) are gone. There is no native
;     USB here -- Serial goes out over UART0 through the on-board USB-serial
;     bridge, which is what `pio device monitor` reads.
;
;  2. 4MB flash, not 8MB. The default env's default_8MB.csv puts app0 at
;     0x10000 with size 0x330000, which runs past the end of a 4MB part. This
;     uses min_spiffs.csv instead: two 1.92MB OTA slots, which is what the
;     LCD build (~1.0MB) needs and enough headroom for the BLE build too.
;     (The plain default.csv gives only 1.31MB per slot, which BLE does not fit.)
;
;  3. DIFFERENT LCD PINS. On classic ESP32, GPIO 6-11 are the SPI flash bus.
;     The S3 default set (MOSI 11, CS 10, DC 9, RST 8) is exactly on top of
;     that and will crash the chip or corrupt flash. SCLK was on GPIO12, which
;     is the MTDI strapping pin that selects flash voltage. All five are remapped
;     below to pins that are neither flash, strapping, input-only, nor UART0.
;
;  4. No GPIO48. The S3's status LED pin does not exist here (classic GPIOs stop
;     at 39), so the heartbeat moves to GPIO25.
;
; Classic ESP32 pin hazards, for reference:
;   strapping : 0, 2, 5, 12, 15
;   flash bus : 6, 7, 8, 9, 10, 11
;   input-only: 34, 35, 36, 39   (cannot drive an output)
;   UART0     : 1 (TX0), 3 (RX0) -- the console
; GPIO16/17 are free here but are PSRAM pins on WROVER modules.
;
; Bafang UARTs keep 17/18 (controller) and 16/4 (display). The display pair is
; moved off GPIO15, which is a strapping pin.
;
; BACKLIGHT -- the most common cause of "it flashed but the screen is dead".
; TFT_eSPI only drives the backlight when TFT_BL >= 0 *and* TFT_BACKLIGHT_ON is
; defined (TFT_eSPI.cpp:786). With TFT_BL=-1 the firmware never turns it on, so
; the module's BLK pin MUST be wired to 3V3 or the panel stays invisible.
;
; To control it in software instead -- which also allows dimming later:
;   wire BLK to a free GPIO (25 is the status LED here; 32/33 are free) and add
;       -DTFT_BL=32
;       -DTFT_BACKLIGHT_ON=HIGH
; A GC9A01 with the backlight off is indistinguishable from a dead panel: black
; glass, no glow, nothing. Rule this out before suspecting the SPI wiring.
;
; SPI runs at 27MHz, matching TFT_eSPI's own Setup200_GC9A01 reference. 40MHz
; often works on short traces but fails on jumper wires, which shows up as a
; blank or garbled panel.
;
; Build and flash:
;   pio run -e gc9a01-esp32 -t upload
; -----------------------------------------------------------------------------
[env:gc9a01-esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
extra_scripts =
    pre:tools/embed_web.py
build_flags =
    ; --- board pin remap (Config.h defaults overridden here) ---
    -DCONTROLLER_RX_PIN=17
    -DCONTROLLER_TX_PIN=18
    -DDISPLAY_RX_PIN=16
    -DDISPLAY_TX_PIN=4
    -DSTATUS_LED_PIN=25
    ; --- display ---
    -DLCD_DISPLAY_GC9A01=1
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=22
    -DTFT_CS=21
    -DTFT_DC=27
    -DTFT_RST=26
    -DTFT_BL=-1
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DTOUCH_CS=-1
