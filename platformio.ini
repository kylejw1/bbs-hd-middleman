; PlatformIO Project Configuration File
;
; One environment. The LCD variants (st7789, gc9a01, gc9a01-esp32) were removed
; along with the display code; `default_envs` stays so a bare `pio run` cannot
; pick up a stray environment added later without it being named here.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Decodes ESP32 panic backtraces into function names and line numbers, so a
; crash log names the offending call instead of just hex addresses.
monitor_filters = default, esp32_exception_decoder
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE is deliberately NOT defined here: the
    ; prebuilt ESP32-S3 sdkconfig.h already sets it to 1, so passing it on the
    ; command line only produced a redefinition warning on every framework file.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
; Regenerates include/WebContent.h from web/index.html before every build so the
; on-device dashboard and the GitHub Pages copy can never drift apart.
extra_scripts =
    pre:tools/embed_web.py
